# Local PostgreSQL for development (matches the version used in CI).
#   docker compose up -d
# Then use this in api/.env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/debate?schema=public
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debate
    ports:
      - "5432:5432"
    volumes:
      - debate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d debate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  debate-pgdata:
